<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>PICK and COOK</title>
    <meta name="description" content="PICK and COOK Website">
    <link rel="shortcut icon" href="img/logo.ico">
    <link rel="stylesheet" href="style/HOME.css">

</head>
<body>
    <div id="container">

            <header id="header">
                <div class="logoandimage">
                    <div class="logo_image">
                        <img id="imglogo" src="img/logo.ico" alt="logo" draggable="false">
                    </div>
                    <div class="title">
                        <p class="font-p">PICK N' COOK</p>
                    </div>
                </div>
                <div class="list_items">
                    <ul class="items">
                        <li><a href="HOME_page.aspx">Home</a></li>
                        <li><a href="recipes.html">Recipes</a></li>
                        <li><a href="planner.html">Planner</a></li>
                        <li><a href="services.html">Pantry</a></li>
                        <li><a href="shop.html">Shop</a></li>
                        <li><a href="favorites.html">Favorites</a></li>
                        <li><a href="LOGIN_page.aspx">Log In</a></li>
                    </ul>
                    <div class="social">
                        <a class="button" href="contact.html"> Contact Us </a>
                    </div>
                    <div class="s">
                        <a href="https://facebook.com/">
                            <img src="img/ff.png" alt="SVG Image" style="width: 30px; height: 30px;" />
                        </a>
                        <a href="https://twitter.com/">
                            <img src="img/t.png" alt="SVG Image" style="width: 30px; height: 30px;" />
                        </a>
                        <a href="https://www.instagram.com/">
                            <img src="img/bi.svg" alt="SVG Image" style="width: 30px; height: 30px;" />
                        </a>
                    </div>
                </div>
            </header>
            <div class="content">
                <video autoplay muted loop id="video">
                    <source src="videos/bg.mp4" type="video/mp4">
                </video>
                <audio id="audio" loop>
                    <source src="videos/audio.mp3" type="audio/mp3">
                </audio>

                <button id="audioButton" onclick="toggleAudio()">
                    <img src="img/ns.png" alt="No_Audio" style="width: 20px; height: 20px;" />
                </button>

                <script>
                    function toggleAudio() {
                        var audio = document.getElementById("audio");
                        var button = document.getElementById("audioButton");

                        if (audio.paused) {
                            audio.play();
                            // Change the image to a different one when the audio plays
                            button.innerHTML = '<img src="img/s.png" alt="Play Audio" style="width: 20px; height: 20px;" />';
                        } else {
                            audio.pause();
                            // Change the image back when the audio is paused
                            button.innerHTML = '<img src="img/ns.png" alt="No_Audio" style="width: 20px; height: 20px;" />';
                        }
                    }
                </script>
            </div>
    </div>
</body>
</html>
